# ===================================
# Daily Stock Analysis - Docker Compose
# ===================================
#
# Usage:
#   Scheduled mode: docker compose -f ./docker/docker-compose.yml up -d
#   API mode:       docker compose -f ./docker/docker-compose.yml up -d server
#   All together:   docker compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    - ../longbridge_tokens:/home/dsa/.longbridge

  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0
    - SEARXNG_BASE_URLS=http://searxng:8080

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  searxng:
    image: searxng/searxng:latest
    container_name: stock-searxng
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8899:8080"
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - http_proxy=http://host.docker.internal:7890
      - https_proxy=http://host.docker.internal:7890
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
      - NO_PROXY=localhost,127.0.0.1,::1
      - no_proxy=localhost,127.0.0.1,::1
    volumes:
      - ./sidecars/searxng/settings.yml:/etc/searxng/settings.yml:ro

  analyzer:
    <<: *common
    container_name: stock-analyzer
    depends_on:
      - searxng

  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "${API_PORT:-8000}"]
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      - searxng
